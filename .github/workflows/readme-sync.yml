name: README sync

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  readme-translation-drift:
    name: readme-translation-drift (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"

      - name: Test README sync checker
        run: python -m unittest discover -s tests -p 'test_readme_sync.py' -v

      - name: Report README translation drift (never blocks merge)
        run: |
          python tools/check_readme_sync.py || echo "::warning file=README.md::A README translation is behind README.md. Run 'python tools/check_readme_sync.py' locally to see which, then translate and backfill the pending changes."
