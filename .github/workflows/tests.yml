name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.12"]
        # Hooks, paths, and encodings break differently off Linux (#213, #219,
        # #265), so run the suite on the other two desktop OSes as well.
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        # tzdata: Windows ships no IANA zone database, which zoneinfo needs.
        run: python -m pip install --upgrade pip pytest tzdata

      - name: Configure git identity
        # Some tests build throwaway git repos and commit to them.
        shell: bash
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Wiki Tester"
          git config --global init.defaultBranch main

      - name: Run test suite
        run: python -m pytest tests/ -q
