# Self-host a vault: `docker compose up -d`. Full guide: docs/deployment.md.
#
# Pulls the released image; `docker compose up --build` builds this checkout instead.
# Settings come from a .env next to this file (see the Memory server section of .env.example).
services:
  wiki:
    image: ghcr.io/ar9av/obsidian-wiki:${WIKI_VERSION:-latest}
    build: .
    # Loopback by default: the API key travels in plain HTTP until TLS sits in front.
    # Set WIKI_PUBLISH=8080 to reach it from your LAN, or use the tls profile below.
    ports: ["${WIKI_PUBLISH:-127.0.0.1:8080}:8080"]
    environment:
      WIKI_API_KEY: ${WIKI_API_KEY:-}
      WIKI_READ_KEY: ${WIKI_READ_KEY:-}
      # Command run on every page write (see docs/deployment.md#write-hook); the script
      # must exist inside the image, so this needs a custom image or a mounted file.
      WIKI_WRITE_HOOK: ${WIKI_WRITE_HOOK:-}
      # Two-way git sync with the vault your laptop's Obsidian opens (off unless set).
      WIKI_GIT_REMOTE: ${WIKI_GIT_REMOTE:-}
      WIKI_GIT_SYNC_INTERVAL: ${WIKI_GIT_SYNC_INTERVAL:-0}
      # OAuth sign-in for MCP clients (claude.ai, ChatGPT, Cursor...). Needs the
      # public https:// URL, e.g. https://${WIKI_DOMAIN} with the tls profile.
      WIKI_OAUTH: ${WIKI_OAUTH:-}
      WIKI_PUBLIC_URL: ${WIKI_PUBLIC_URL:-}
      WIKI_RATE_LIMIT: ${WIKI_RATE_LIMIT:-600}
      WIKI_AUTH_LOCKOUT: ${WIKI_AUTH_LOCKOUT:-10}
      # Caddy reaches the server over the compose network, so trust its
      # X-Forwarded-For; otherwise every client looks like Caddy to the rate limit
      # and lockout. If you publish the port beyond loopback without a proxy, set
      # this to your proxy's address (or leave it empty) so clients can't spoof it.
      WIKI_TRUSTED_PROXIES: ${WIKI_TRUSTED_PROXIES-*}
    volumes:
      # Swap for a bind mount to serve a vault you already have: /path/to/vault:/vault
      - wiki-data:/vault
    restart: unless-stopped

  # HTTPS with an automatic Let's Encrypt certificate:
  #   WIKI_DOMAIN=wiki.example.com docker compose --profile tls up -d
  # The domain's DNS must point at this host, with ports 80 and 443 open.
  caddy:
    image: caddy:2
    profiles: [tls]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      WIKI_DOMAIN: ${WIKI_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [wiki]
    restart: unless-stopped

volumes:
  wiki-data:
  caddy-data:
  caddy-config:
